name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required for actions/attest-build-provenance to mint a signed provenance
  # attestation for the released artifacts.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" \
            --jq '.status')"
          echo "compare status: $status"
          # "identical" means the tag points at main's tip; "behind" means the
          # tagged commit is an ancestor of main. Anything else (ahead/diverged)
          # means the tag is not on main, so refuse to release.
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "error: tagged commit ${GITHUB_SHA} is not on main (status: ${status}); refusing to release" >&2
            exit 1
          fi

      - name: Set up mise (installs the toolchain from mise.toml)
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "hjkl-for-mac"))')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "error: tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - name: Build release binary
        run: mise run build

      - name: Package artifact
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dist="hjkl-${version}-macos-$(uname -m)"
          mkdir -p "dist/$dist"
          cp target/release/hjkl "dist/$dist/hjkl"
          cp README.md LICENSE CHANGELOG.md "dist/$dist/"
          tarball="${dist}.tar.gz"
          tar -C dist -czf "$tarball" "$dist"
          shasum -a 256 "$tarball" > "${tarball}.sha256"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.TARBALL }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$TARBALL" "${TARBALL}.sha256"
