name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required for actions/attest-build-provenance to mint a signed provenance
  # attestation for the released artifacts.
  id-token: write
  attestations: write

jobs:
  release-macos:
    name: Build and publish macOS release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise (installs the toolchain from mise.toml)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Verify tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" \
            --jq '.status')"
          echo "compare status: $status"
          # "identical" means the tag points at main's tip; "behind" means the
          # tagged commit is an ancestor of main. Anything else (ahead/diverged)
          # means the tag is not on main, so refuse to release.
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "error: tagged commit ${GITHUB_SHA} is not on main (status: ${status}); refusing to release" >&2
            exit 1
          fi

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "hjkl"))')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "error: tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - name: Build release binary
        run: mise run build

      - name: Package artifact
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dist="hjkl-${version}-macos-$(uname -m)"
          mkdir -p "dist/$dist"
          cp target/release/hjkl "dist/$dist/hjkl"
          cp README.md LICENSE CHANGELOG.md "dist/$dist/"
          tarball="${dist}.tar.gz"
          tar -C dist -czf "$tarball" "$dist"
          shasum -a 256 "$tarball" > "${tarball}.sha256"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.TARBALL }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$TARBALL" "${TARBALL}.sha256"

  release-windows:
    name: Build and upload Windows release
    runs-on: windows-latest
    needs: release-macos

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise (installs the toolchain from mise.toml)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Verify tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $status = gh api "repos/$env:GITHUB_REPOSITORY/compare/main...$env:GITHUB_SHA" --jq ".status"
          Write-Output "compare status: $status"
          if ($status -ne "identical" -and $status -ne "behind") {
            Write-Error "tagged commit $env:GITHUB_SHA is not on main (status: $status); refusing to release"
            exit 1
          }

      - name: Verify tag matches Cargo.toml version
        run: |
          $tag = $env:GITHUB_REF_NAME -replace "^v", ""
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $crate = ($metadata.packages | Where-Object { $_.name -eq "hjkl" }).version
          Write-Output "tag=$tag crate=$crate"
          if ($tag -ne $crate) {
            Write-Error "tag v$tag does not match Cargo.toml version $crate"
            exit 1
          }

      - name: Build release binary
        run: mise run build

      - name: Package artifact
        run: |
          $version = $env:GITHUB_REF_NAME -replace "^v", ""
          $dist = "hjkl-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$dist" | Out-Null
          Copy-Item "target/release/hjkl.exe" "dist/$dist/hjkl.exe"
          Copy-Item "README.md", "LICENSE", "CHANGELOG.md" "dist/$dist/"
          $zip = "$dist.zip"
          Compress-Archive -Path "dist/$dist" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ZIP }}

      - name: Upload Windows assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "$env:ZIP" "${env:ZIP}.sha256" --clobber
