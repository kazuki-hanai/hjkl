version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Dependabot bumps both the
  # pinned commit SHA and the version comment, so pinning stays secure without
  # going stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # No third-party crates today, but this covers any future dependency and the
  # lockfile once one is added.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
