[package]
name = "hjkl-for-mac"
version = "0.1.0"
edition = "2024"
authors = ["Kazuki Hanai"]
description = "A tiny macOS keyboard remapper that turns semicolon + hjkl into arrow keys."
repository = "https://github.com/kazuki-hanai/hjkl-for-mac"
license = "MIT"
readme = "README.md"
keywords = ["macos", "keyboard", "remap", "hjkl", "launchagent"]
categories = ["command-line-utilities"]

[[bin]]
name = "hjkl"
path = "src/main.rs"

[dependencies]
